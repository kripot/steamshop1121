<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>SteamShop — Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">SteamShop</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="catalog.html">Каталог</a>
            <a href="about.html">О нас</a>
            <a href="contacts.html" class="active">Контакты</a>
        </nav>
    </header>

    <main class="contacts-container">
        <h2>Связаться с нами</h2>
        <p>Если у вас возникли вопросы, напишите нам!</p>
        
        <form class="contact-form" onsubmit="alert('возможно отправлено!'); return false;">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" required placeholder="imya">

            <label for="email">Ваш Email:</label>
            <input type="email" id="email" required placeholder="pochta@mail.ru">

            <label for="message">Сообщение:</label>
            <textarea id="message" rows="5" required placeholder="Введите текст"></textarea>

            <button type="submit" class="btn">Отправить</button>
        </form>
    </main>

    <footer>
        <p>SteamShop</p>
    </footer>


</body>

</html>
